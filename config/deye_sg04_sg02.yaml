#
# Deye | SG04LP3 / SG02LP3 | Single-Phase Hybrid Inverter | 4 MPPT
#
# Reference: https://github.com/user-attachments/files/16798469/MODBUS.RTU.V105.1-20231006.pdf
#
# Adapted for Single-Phase: SG04LP3 and SG02LP3
# Tested with LSW3_15_FFFF_1.0.91R Stick Logger
#

info:
  manufacturer: Deye
  model: [SG04LP3, SG02LP3]

default:
  update_interval: 60
  digits: 2

requests:
  - start: 0x0000
    end:  0x0400
    mb_functioncode: 0x03

parameters:
  - group: Info
    update_interval: 3600
    items:
      - name: "Device"
        class: "enum"
        rule: 1
        registers: [0x0000]
        lookup:
          - key: 0x0005
            value: "LV Single-Phase Hybrid Inverter"
          - key: default
            value: "Unknown"

      - name: "Device Serial Number"
        rule: 5
        registers: [0x0003, 0x0004, 0x0005, 0x0006, 0x0007]

      - name: "Device Protocol Version"
        rule: 7
        remove: "0."
        registers: [0x0002]

  - group: Solar
    update_interval: 5
    items:
      - name: "PV1 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0107]
        icon: "mdi:solar-power"

      - name: "PV1 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x0108]
        icon: "mdi:solar-power"

      - name: "PV2 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0109]
        icon: "mdi:solar-power"

      - name: "PV2 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x010A]
        icon: "mdi:solar-power"

      - name: "PV3 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x010B]
        icon: "mdi:solar-power"

      - name: "PV3 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x010C]
        icon: "mdi:solar-power"

      - name: "PV4 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x010D]
        icon: "mdi:solar-power"

      - name: "PV4 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x010E]
        icon: "mdi:solar-power"

      - name: "PV Total Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: [1, 10]
        rule: 1
        registers: [0x0115]
        icon: "mdi:solar-power-variant"

      - name: "Today Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0118]
        icon: "mdi:solar-power"
        validation:
          min: 0.1

      - name: "Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0119, 0x011A]
        icon: "mdi:solar-power"
        validation:
          min: 0.1

  - group: Battery
    update_interval: 5
    items:
      - name: "Battery Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0106]

      - name: "Battery"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        rule: 1
        registers: [0x0108]
        validation:
          min: 0
          max: 100

      - name: "Battery Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: [1, 10]
        rule: 2
        registers: [0x0110]
        attributes: [inverse]

      - name: "Battery Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x0111]
        icon: "mdi:current-dc"

      - name: "Battery Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x0138]
        range:
          min: 0
          max: 3000
        validation:
          min: -99
          max: 99

  - group: Grid
    update_interval: 5
    items:
      - name: "Grid Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0104]
        icon: "mdi:transmission-tower"

      - name: "Grid Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 2
        registers: [0x0105]
        icon: "mdi:transmission-tower"

      - name: "Grid Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: [1, 10]
        rule: 2
        registers: [0x0147, 0x0148]
        icon: "mdi:transmission-tower"
        attributes: [inverse]

      - name: "Grid Frequency"
        class: "frequency"
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x0103]

      - name: "Today Energy Import"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x011B]
        icon: "mdi:transmission-tower-export"

      - name: "Total Energy Import"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x011C, 0x011D]
        icon: "mdi:transmission-tower-export"

      - name: "Today Energy Export"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x011E]
        icon: "mdi:transmission-tower-import"

      - name: "Total Energy Export"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x011F, 0x0120]
        icon: "mdi:transmission-tower-import"

  - group: Inverter
    update_interval: 5
    items:
      - name: "Running Status"
        class: "enum"
        rule: 1
        registers: [0x0100]
        lookup:
          - key: 0x0000
            value: "Standby"
          - key: 0x0001
            value: "Self-test"
          - key: 0x0002
            value: "Normal"
          - key: 0x0003
            value: "Alarm"
          - key: 0x0004
            value: "Fault"
          - key: default
            value: "Unknown"

      - name: "DC Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x0139]
        range:
          min: 0
          max: 3000
        validation:
          min: -99
          max: 99

      - name: "AC Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: 0.1
        rule: 2
        offset: 1000
        registers: [0x013A]
        range:
          min: 0
          max: 3000
        validation:
          min: -99
          max: 99

      - name: "Output Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: [1, 10]
        rule: 1
        registers: [0x0112]
        icon: "mdi:home-lightning-bolt"

      - name: "Daily Load Consumption"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 1
        registers: [0x0121]

      - name: "Total Load Consumption"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0122, 0x0123]
